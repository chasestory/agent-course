[package]
name = "agent-course"
version = "0.1.0"
edition = "2021"
description = "Offline desktop course: practical agent-engineering skills with quizzes and curated links."

[[bin]]
name = "agent-course"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

[profile.release]
opt-level = 3
strip = true
